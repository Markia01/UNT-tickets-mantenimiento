name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Revisión de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # App de Next.js (frontend + API) en la raíz
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

      # Servidor de Express anterior, mientras se pasa a src/app/api
      - name: Backend (Express) — instalar dependencias
        working-directory: backend
        run: npm ci
      - name: Backend (Express) — lint
        working-directory: backend
        run: npm run lint
